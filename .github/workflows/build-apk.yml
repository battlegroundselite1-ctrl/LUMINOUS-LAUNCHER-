name: Build LUMINOUS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LUMINOUS-Launcher-Android-Starter.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Unpack LUMINOUS starter project
        run: |
          mkdir luminous-src
          unzip LUMINOUS-Launcher-Android-Starter.zip -d luminous-src

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p luminous-src assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMINOUS-debug-APK
          path: luminous-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
